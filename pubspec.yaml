name: takturns_flutter_app
description: "Takturns — Onchain Rotating Savings (Ajo) on Arbitrum"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Dependency Injection
  get_it: ^8.0.3

  # Blockchain
  web3dart: ^2.7.3
  http: ^1.2.2

  # Utilities
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fluttertoast: ^8.2.12
  shimmer: ^3.0.0

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # URL launch (for wallet deep linking)
  url_launcher: ^6.3.1

  # Google Fonts
  google_fonts: ^6.2.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
